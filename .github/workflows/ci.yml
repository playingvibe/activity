# Runs on every push to main and every pull request, from forks too.
#
# It uses `pull_request`, never `pull_request_target`, so a fork's code runs with a read-only token
# and no secrets, and nothing here reads a secret. It deploys nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  activity:
    name: Lint, type check and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: activity
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: activity/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
